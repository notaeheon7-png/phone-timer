<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>모자 아이폰 자동 타이머</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 95%;
        max-width: 900px;
    }

    h1 {
        font-size: 28px;
        margin-bottom: 15px;
    }

    #timer {
        font-size: 70px;
        font-weight: bold;
        letter-spacing: 3px;
        margin: 20px 0;
    }

    .inputs {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 15px;
    }

    input {
        width: 80px;
        padding: 12px;
        font-size: 20px;
        text-align: center;
        border-radius: 10px;
        border: none;
    }

    button {
        width: 100%;
        max-width: 500px;
        padding: 15px;
        margin: 6px 0;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: bold;
    }

    #status {
        margin: 15px 0;
        font-size: 20px;
    }

    #sensorData {
        margin-top: 15px;
        padding: 15px;
        background: #222;
        border-radius: 12px;
        font-size: 15px;
        line-height: 1.7;
    }

    .up {
        color: #00ff88;
    }

    .down {
        color: #ff6666;
    }
</style>
</head>

<body>

<div class="container">

    <h1>📱 모자 아이폰 자동 타이머</h1>

    <div id="timer">00:00:00</div>

    <div class="inputs">
        <input id="hours" type="number" min="0" value="0" placeholder="시">
        <input id="minutes" type="number" min="0" max="59" value="1" placeholder="분">
        <input id="seconds" type="number" min="0" max="59" value="0" placeholder="초">
    </div>

    <button onclick="setTimer()">⏱️ 시간 설정</button>

    <button onclick="startSensors()">
        📱 센서 시작
    </button>

    <button onclick="resetTimer()">
        🔄 초기화
    </button>

    <div id="status">
        센서를 시작해주세요
    </div>

    <div id="sensorData">
        가속도계: 대기 중<br>
        자이로: 대기 중<br>
        상태: 대기 중
    </div>

</div>

<script>

let totalSeconds = 0;
let remainingSeconds = 0;

let timerInterval = null;
let sensorStarted = false;

let acceleration = {
    x: 0,
    y: 0,
    z: 0
};

let rotation = {
    alpha: 0,
    beta: 0,
    gamma: 0
};

let lastMagnitude = 0;
let movementScore = 0;

let isUp = false;


/* =========================
   시간 표시
========================= */

function updateDisplay() {

    let h = Math.floor(remainingSeconds / 3600);

    let m = Math.floor(
        (remainingSeconds % 3600) / 60
    );

    let s = remainingSeconds % 60;

    document.getElementById("timer").textContent =
        String(h).padStart(2, "0") + ":" +
        String(m).padStart(2, "0") + ":" +
        String(s).padStart(2, "0");
}


/* =========================
   시간 설정
========================= */

function setTimer() {

    let h = Number(
        document.getElementById("hours").value
    );

    let m = Number(
        document.getElementById("minutes").value
    );

    let s = Number(
        document.getElementById("seconds").value
    );

    totalSeconds =
        h * 3600 +
        m * 60 +
        s;

    remainingSeconds = totalSeconds;

    stopTimer();
    updateDisplay();

    document.getElementById("status").textContent =
        "시간 설정 완료";
}


/* =========================
   타이머 시작
========================= */

function startTimer() {

    if (remainingSeconds <= 0) return;

    if (timerInterval !== null) return;

    timerInterval = setInterval(() => {

        if (remainingSeconds > 0) {

            remainingSeconds--;

            updateDisplay();

        } else {

            stopTimer();

            document.getElementById("status").textContent =
                "⏰ 완료!";
        }

    }, 1000);
}


/* =========================
   타이머 정지
========================= */

function stopTimer() {

    if (timerInterval !== null) {

        clearInterval(timerInterval);

        timerInterval = null;
    }
}


/* =========================
   초기화
========================= */

function resetTimer() {

    stopTimer();

    remainingSeconds = totalSeconds;

    isUp = false;

    updateDisplay();

    document.getElementById("status").textContent =
        "초기화됨";
}


/* =========================
   센서 시작
========================= */

async function startSensors() {

    try {

        /*
         iPhone Safari 센서 권한 요청
        */

        if (
            typeof DeviceMotionEvent !== "undefined" &&
            typeof DeviceMotionEvent.requestPermission === "function"
        ) {

            const motionPermission =
                await DeviceMotionEvent.requestPermission();

            if (motionPermission !== "granted") {

                alert(
                    "가속도 센서 권한을 허용해주세요."
                );

                return;
            }
        }


        if (
            typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function"
        ) {

            const orientationPermission =
                await DeviceOrientationEvent.requestPermission();

            if (orientationPermission !== "granted") {

                alert(
                    "기울기 센서 권한을 허용해주세요."
                );

                return;
            }
        }


        window.addEventListener(
            "devicemotion",
            handleMotion,
            true
        );

        window.addEventListener(
            "deviceorientation",
            handleOrientation,
            true
        );

        sensorStarted = true;

        document.getElementById("status").textContent =
            "📱 센서 작동 중";

    } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "센서를 사용할 수 없습니다.";

    }
}


/* =========================
   가속도 센서
========================= */

function handleMotion(event) {

    let acc =
        event.accelerationIncludingGravity;

    if (!acc) return;

    acceleration.x = acc.x || 0;
    acceleration.y = acc.y || 0;
    acceleration.z = acc.z || 0;


    /*
       전체 가속도 크기 계산
    */

    let magnitude = Math.sqrt(
        acceleration.x * acceleration.x +
        acceleration.y * acceleration.y +
        acceleration.z * acceleration.z
    );


    /*
       이전 값과 비교해서 움직임 감지
    */

    let change =
        Math.abs(magnitude - lastMagnitude);

    lastMagnitude = magnitude;


    /*
       움직임 점수 누적
    */

    if (change > 1.5) {

        movementScore += 2;

    } else {

        movementScore *= 0.95;
    }


    /*
       센서 정보 표시
    */

    updateSensorDisplay(magnitude);
}


/* =========================
   기울기 센서
========================= */

function handleOrientation(event) {

    rotation.alpha =
        event.alpha || 0;

    rotation.beta =
        event.beta || 0;

    rotation.gamma =
        event.gamma || 0;


    /*
       모자에 아이폰을 고정했을 때
       위로 올라가는 동작을 감지하기 위한
       기본적인 기울기 기준
    */

    let beta = rotation.beta;


    /*
       beta가 특정 범위를 넘으면
       아이폰이 위쪽 방향으로 이동했다고 판단
    */

    if (beta > 55 && beta < 125) {

        if (!isUp) {

            isUp = true;

            document.getElementById("status").innerHTML =
                '<span class="up">⬆️ 위로 올라감 → 타이머 시작</span>';

            startTimer();
        }

    } else {

        if (isUp) {

            isUp = false;

            document.getElementById("status").innerHTML =
                '<span class="down">⬇️ 내려감 → 타이머 일시정지</span>';

            stopTimer();
        }
    }


    updateSensorDisplay();
}


/* =========================
   센서 정보 표시
========================= */

function updateSensorDisplay(magnitude) {

    let text =
        "가속도 X: " +
        acceleration.x.toFixed(2) +
        "<br>" +

        "가속도 Y: " +
        acceleration.y.toFixed(2) +
        "<br>" +

        "가속도 Z: " +
        acceleration.z.toFixed(2) +
        "<br><br>" +

        "기울기 β: " +
        rotation.beta.toFixed(1) +
        "°" +
        "<br>" +

        "기울기 γ: " +
        rotation.gamma.toFixed(1) +
        "°" +
        "<br>" +

        "움직임 점수: " +
        movementScore.toFixed(1);


    if (isUp) {

        text +=
            "<br><br><span class='up'>" +
            "⬆️ 현재 위쪽 상태" +
            "</span>";

    } else {

        text +=
            "<br><br><span class='down'>" +
            "⬇️ 현재 아래쪽 상태" +
            "</span>";
    }


    document.getElementById("sensorData").innerHTML =
        text;
}


/* =========================
   처음 화면
========================= */

updateDisplay();

</script>

</body>
</html>
