<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>머리 위 카운트다운</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}

body{
  overflow:hidden;
}

.container{
  width:100%;
  height:100vh;
  padding:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

h1{
  margin:2px 0 8px;
  font-size:24px;
}

.settings{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

input{
  width:70px;
  height:45px;
  border:0;
  border-radius:10px;
  text-align:center;
  font-size:22px;
}

.labels{
  font-size:14px;
  margin-bottom:5px;
}

#timer{
  font-size:55px;
  font-weight:bold;
  margin:8px 0;
}

button{
  border:0;
  border-radius:12px;
  padding:11px 16px;
  margin:3px;
  font-size:16px;
}

#status{
  min-height:25px;
  margin:5px;
  font-size:16px;
}

video{
  width:min(80vw,700px);
  height:auto;
  max-height:48vh;
  object-fit:cover;
  border-radius:18px;
  transform:scaleX(-1);
}

/* 세로로 들고 있을 때 안내 */
#rotateMessage{
  display:none;
  position:fixed;
  inset:0;
  background:#111;
  color:white;
  z-index:99;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:24px;
  padding:30px;
}

@media (orientation: portrait){
  #rotateMessage{
    display:flex;
  }
}

</style>
</head>

<body>

<div id="rotateMessage">
  📱<br><br>
  아이폰을 가로로 돌려주세요
</div>

<div class="container">

<h1>📱 머리 위 자동 카운트다운</h1>

<div class="settings">

<input id="hours" type="number" min="0" value="0">

<input id="minutes" type="number" min="0" value="0">

<input id="secs" type="number" min="0" value="30">

</div>

<div class="labels">
시　　분　　초
</div>

<div id="timer">00:00:30</div>

<div>
<button onclick="setTime()">⏱️ 시간 설정</button>
<button onclick="startCamera()">📷 카메라 시작</button>
<button onclick="resetTimer()">🔄 초기화</button>
</div>

<div id="status">
시간을 설정해주세요.
</div>

<video id="video" autoplay playsinline muted></video>

</div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4.1646425229/face_detection.js"></script>

<script>

let remainingSeconds = 30;
let running = false;
let timerInterval = null;
let detectorStarted = false;

let upCount = 0;
let downCount = 0;

const REQUIRED_COUNT = 8;

const timer = document.getElementById("timer");
const statusText = document.getElementById("status");
const video = document.getElementById("video");


function formatTime(seconds){

  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;

  return String(h).padStart(2,"0") + ":" +
         String(m).padStart(2,"0") + ":" +
         String(s).padStart(2,"0");
}


function updateTimer(){

  timer.textContent = formatTime(remainingSeconds);

}


function setTime(){

  stopTimer();

  const h = Number(document.getElementById("hours").value) || 0;
  const m = Number(document.getElementById("minutes").value) || 0;
  const s = Number(document.getElementById("secs").value) || 0;

  remainingSeconds = h * 3600 + m * 60 + s;

  updateTimer();

  statusText.textContent =
    "⏱️ " + formatTime(remainingSeconds) + " 설정 완료";
}


function startTimer(){

  if(running || remainingSeconds <= 0) return;

  running = true;

  timerInterval = setInterval(function(){

    if(remainingSeconds > 0){

      remainingSeconds--;

      updateTimer();

    }

    if(remainingSeconds <= 0){

      stopTimer();

      statusText.textContent = "🏁 시간 종료!";

    }

  },1000);
}


function stopTimer(){

  running = false;

  if(timerInterval !== null){

    clearInterval(timerInterval);
    timerInterval = null;

  }
}


function resetTimer(){

  stopTimer();

  const h = Number(document.getElementById("hours").value) || 0;
  const m = Number(document.getElementById("minutes").value) || 0;
  const s = Number(document.getElementById("secs").value) || 0;

  remainingSeconds = h * 3600 + m * 60 + s;

  upCount = 0;
  downCount = 0;

  updateTimer();

  statusText.textContent = "🔄 초기화 완료";

}


async function startCamera(){

  try{

    statusText.textContent = "🟡 카메라 준비 중...";

    if(typeof FaceDetection === "undefined"){

      throw new Error("얼굴 인식 기능을 불러오지 못했습니다.");

    }

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:"user",
          width:{ideal:1280},
          height:{ideal:720}
        },
        audio:false
      });

    video.srcObject = stream;

    await video.play();

    statusText.textContent = "🟡 얼굴 인식 중...";

    startFaceDetection();

  }catch(error){

    console.error(error);

    statusText.textContent =
      "❌ 오류: " + error.message;

  }

}


function startFaceDetection(){

  if(detectorStarted) return;

  detectorStarted = true;

  const faceDetection = new FaceDetection({

    locateFile:function(file){

      return "https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4.1646425229/" + file;

    }

  });


  faceDetection.setOptions({

    model:"short",

    minDetectionConfidence:0.5

  });


  faceDetection.onResults(function(results){

    if(!results.detections ||
       results.detections.length === 0){

      upCount = 0;
      downCount = 0;

      stopTimer();

      statusText.textContent =
        "🔴 얼굴을 찾는 중...";

      return;

    }


    const box =
      results.detections[0].boundingBox;

    const centerY = box.yCenter;


    /* 얼굴이 화면 아래쪽이면 머리 위로 판단 */

    if(centerY > 0.55){

      downCount = 0;
      upCount++;

      if(upCount >= REQUIRED_COUNT){

        startTimer();

        statusText.textContent =
          "🟢 머리 위 → 카운트다운 실행";

      }else{

        statusText.textContent =
          "🟡 머리 위 확인 중...";

      }

    }else{

      upCount = 0;
      downCount++;

      if(downCount >= REQUIRED_COUNT){

        stopTimer();

        statusText.textContent =
          "🔴 아래 → 일시정지";

      }else{

        statusText.textContent =
          "🟡 일시정지 확인 중...";

      }

    }

  });


  async function detect(){

    try{

      if(video.readyState >= 2){

        await faceDetection.send({
          image:video
        });

      }

    }catch(error){

      console.error(error);

      statusText.textContent =
        "❌ 얼굴 인식 오류";

    }

    requestAnimationFrame(detect);

  }

  detect();

}


updateTimer();

</script>

</body>
</html>
