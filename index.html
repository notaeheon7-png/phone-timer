<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>머리 위 카운트다운</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}

body{
  text-align:center;
}

.container{
  width:100%;
  min-height:100vh;
  padding:12px;
}

h1{
  margin:4px 0 8px;
  font-size:24px;
}

.settings{
  display:flex;
  justify-content:center;
  gap:8px;
}

input{
  width:75px;
  height:44px;
  border:0;
  border-radius:10px;
  text-align:center;
  font-size:20px;
}

.labels{
  margin:3px 0;
}

#timer{
  font-size:55px;
  font-weight:bold;
  margin:8px 0;
}

button{
  font-size:16px;
  padding:11px 15px;
  margin:3px;
  border:0;
  border-radius:12px;
}

#status{
  min-height:25px;
  margin:7px;
  font-size:16px;
}

video{
  width:min(80vw,700px);
  max-height:50vh;
  border-radius:18px;
  object-fit:cover;
  transform:scaleX(-1);
}

/* 가로 화면에서 보기 좋게 */
@media (orientation: landscape){

  .container{
    padding:8px;
  }

  h1{
    font-size:20px;
    margin:2px;
  }

  #timer{
    font-size:48px;
    margin:4px;
  }

  video{
    width:min(70vw,650px);
    max-height:55vh;
  }
}

</style>
</head>

<body>

<div class="container">

<h1>📱 머리 위 자동 카운트다운</h1>

<div class="settings">

<input id="hours"
       type="number"
       min="0"
       value="0">

<input id="minutes"
       type="number"
       min="0"
       value="0">

<input id="secs"
       type="number"
       min="0"
       value="30">

</div>

<div class="labels">
시　 분　 초
</div>

<div id="timer">
00:00:30
</div>

<button onclick="setTime()">
⏱️ 시간 설정
</button>

<button onclick="startCamera()">
📷 카메라 시작
</button>

<button onclick="resetTimer()">
🔄 초기화
</button>

<div id="status">
시간을 설정해주세요.
</div>

<video id="video"
       autoplay
       playsinline
       muted>
</video>

</div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4.1646425229/face_detection.js"></script>


<script>

let remainingSeconds = 30;

let running = false;

let timerInterval = null;

let detectorStarted = false;

let upCount = 0;

let downCount = 0;

const REQUIRED_COUNT = 8;

const timer =
document.getElementById("timer");

const statusText =
document.getElementById("status");

const video =
document.getElementById("video");


/* =========================
   시간 표시
========================= */

function formatTime(seconds){

  const h =
    Math.floor(seconds / 3600);

  const m =
    Math.floor((seconds % 3600) / 60);

  const s =
    seconds % 60;

  return String(h).padStart(2,"0")
    + ":" +
    String(m).padStart(2,"0")
    + ":" +
    String(s).padStart(2,"0");

}


function updateTimer(){

  timer.textContent =
    formatTime(remainingSeconds);

}


/* =========================
   시간 설정
========================= */

function setTime(){

  stopTimer();

  const h =
    Number(document.getElementById("hours").value) || 0;

  const m =
    Number(document.getElementById("minutes").value) || 0;

  const s =
    Number(document.getElementById("secs").value) || 0;

  remainingSeconds =
    h * 3600 + m * 60 + s;

  updateTimer();

  statusText.textContent =
    "⏱️ " +
    formatTime(remainingSeconds) +
    " 설정 완료";

}


/* =========================
   카운트다운 시작
========================= */

function startTimer(){

  if(running) return;

  if(remainingSeconds <= 0) return;

  running = true;

  timerInterval =
    setInterval(function(){

      if(remainingSeconds > 0){

        remainingSeconds--;

        updateTimer();

      }

      if(remainingSeconds <= 0){

        stopTimer();

        statusText.textContent =
          "🏁 시간 종료!";

      }

    },1000);

}


/* =========================
   일시정지
========================= */

function stopTimer(){

  running = false;

  if(timerInterval){

    clearInterval(timerInterval);

    timerInterval = null;

  }

}


/* =========================
   초기화
========================= */

function resetTimer(){

  stopTimer();

  const h =
    Number(document.getElementById("hours").value) || 0;

  const m =
    Number(document.getElementById("minutes").value) || 0;

  const s =
    Number(document.getElementById("secs").value) || 0;

  remainingSeconds =
    h * 3600 + m * 60 + s;

  upCount = 0;

  downCount = 0;

  updateTimer();

  statusText.textContent =
    "🔄 초기화 완료";

}


/* =========================
   카메라
========================= */

async function startCamera(){

  try{

    statusText.textContent =
      "🟡 카메라 준비 중...";


    if(typeof FaceDetection === "undefined"){

      throw new Error(
        "얼굴 인식 라이브러리를 불러오지 못했습니다."
      );

    }


    const stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user",
          width:{
            ideal:640
          },
          height:{
            ideal:480
          }
        },

        audio:false

      });


    video.srcObject = stream;


    await video.play();


    statusText.textContent =
      "🟡 얼굴 인식 준비 중...";


    startFaceDetection();


  }catch(error){

    console.error(error);

    statusText.textContent =
      "❌ 카메라는 작동하지만 얼굴 인식 오류";

  }

}


/* =========================
   얼굴 인식
========================= */

function startFaceDetection(){

  if(detectorStarted) return;

  detectorStarted = true;


  const faceDetection =
    new FaceDetection({

      locateFile:function(file){

        return "https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4.1646425229/" + file;

      }

    });


  faceDetection.setOptions({

    model:"short",

    minDetectionConfidence:0.5

  });


  faceDetection.onResults(function(results){


    /* 얼굴이 안 보임 */

    if(
      !results.detections ||
      results.detections.length === 0
    ){

      upCount = 0;

      downCount = 0;

      stopTimer();

      statusText.textContent =
        "🔴 얼굴을 찾는 중...";

      return;

    }


    /* 얼굴 발견 */

    const box =
      results.detections[0].boundingBox;


    const centerY =
      box.yCenter;


    /*
      얼굴 중심이 아래쪽이면
      휴대폰이 머리 위에 있다고 판단
    */

    if(centerY > 0.55){

      downCount = 0;

      upCount++;


      if(upCount >= REQUIRED_COUNT){

        startTimer();

        statusText.textContent =
          "🟢 머리 위 → 카운트다운";

      }else{

        statusText.textContent =
          "🟡 머리 위 확인 중...";

      }

    }else{

      upCount = 0;

      downCount++;


      if(downCount >= REQUIRED_COUNT){

        stopTimer();

        statusText.textContent =
          "🔴 아래 → 일시정지";

      }else{

        statusText.textContent =
          "🟡 일시정지 확인 중...";

      }

    }

  });


  /* 얼굴 인식 반복 */

  async function detect(){

    try{

      if(video.readyState >= 2){

        await faceDetection.send({
          image:video
        });

      }

    }catch(error){

      console.error(error);

      /*
        일시적인 프레임 오류는
        계속 다시 시도
      */

    }


    requestAnimationFrame(detect);

  }


  detect();

}


/* 처음 표시 */

updateTimer();

</script>

</body>
</html>
